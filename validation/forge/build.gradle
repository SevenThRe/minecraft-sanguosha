plugins { id 'net.minecraftforge.gradle' }
apply from: rootProject.file('loader.gradle')
minecraft {
    mappings channel: 'official', version: minecraft_version
    reobf = false
    copyIdeResources = true
    runs {
        client {
            workingDirectory file('runs/client')
            if (providers.gradleProperty('clientSmoke').isPresent()) {
                property 'sgs.clientSmoke', 'true'
                args '--quickPlayMultiplayer', '127.0.0.1:25590'
                if (providers.gradleProperty('artSmoke').isPresent()) property 'sgs.artSmoke', 'true'
            }
            mods { sgs { source sourceSets.main; source project(':sgs-core').sourceSets.main } }
        }
        server {
            workingDirectory file('runs/server')
            args '--nogui'
            property 'sgs.smoke', providers.gradleProperty('smokePhase').getOrElse('')
            property 'terminal.jline', 'false'
            property 'terminal.ansi', 'false'
            mods { sgs { source sourceSets.main; source project(':sgs-core').sourceSets.main } }
        }
    }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation("net.blay09.mods:balm-forge:${balm_version}") { transitive = false }
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}
// Forge's development mod locator needs resources alongside compiled classes.
sourceSets.main.output.resourcesDir = layout.buildDirectory.dir('classes/java/main').get().asFile
