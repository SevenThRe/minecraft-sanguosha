import java.awt.Color
import java.awt.Graphics2D
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/sgs.accesswidener")
}

def generatedResourcesDir = layout.buildDirectory.dir("generatedResources")

sourceSets {
    main {
        resources {
            srcDir generatedResourcesDir
        }
    }
}

// Build-time placeholder art so the mod ships with valid textures without any
// binary assets in the repository. Replace later with hand-drawn textures.
tasks.register("generatePlaceholderTextures") {
    def outputDir = generatedResourcesDir
    outputs.dir(outputDir)
    doLast {
        System.setProperty("java.awt.headless", "true")
        def blockDir = new File(outputDir.get().asFile, "assets/sgs/textures/block")
        blockDir.mkdirs()

        def size = 16
        def frame = new Color(0x6D, 0x4C, 0x41)
        def frameDark = new Color(0x4E, 0x34, 0x2E)
        def felt = new Color(0x2E, 0x7D, 0x32)
        def feltLine = new Color(0x38, 0x8E, 0x3C)
        def plankA = new Color(0x8D, 0x6E, 0x63)
        def plankB = new Color(0x79, 0x5B, 0x51)
        def groove = new Color(0x3E, 0x27, 0x23)

        def draw = { String name, Closure<?> painter ->
            def img = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB)
            Graphics2D g = img.createGraphics()
            painter.call(g)
            g.dispose()
            ImageIO.write(img, "PNG", new File(blockDir, name))
        }

        draw("card_table_top.png") { Graphics2D g ->
            g.setColor(frame)
            g.fillRect(0, 0, 16, 16)
            g.setColor(felt)
            g.fillRect(2, 2, 12, 12)
            g.setColor(feltLine)
            g.drawLine(3, 3, 12, 12)
            g.drawLine(12, 3, 3, 12)
            g.setColor(frameDark)
            g.drawRect(0, 0, 15, 15)
        }
        draw("card_table_side.png") { Graphics2D g ->
            g.setColor(plankA)
            g.fillRect(0, 0, 16, 16)
            g.setColor(plankB)
            g.fillRect(0, 5, 16, 1)
            g.fillRect(0, 10, 16, 1)
            g.setColor(frameDark)
            g.drawRect(0, 0, 15, 15)
        }
        draw("card_table_bottom.png") { Graphics2D g ->
            g.setColor(frameDark)
            g.fillRect(0, 0, 16, 16)
            g.setColor(groove)
            for (int y = 0; y < 16; y += 4) {
                g.drawLine(0, y, 15, y)
            }
        }
    }
}

tasks.named("processResources") {
    dependsOn("generatePlaceholderTextures")
}

tasks.named("sourcesJar") {
    dependsOn("generatePlaceholderTextures")
}

dependencies {
    // Fabric loader is referenced only for its environment annotations.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"

}


publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
