org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true

# Local network proxy required to reach Maven repositories in this environment.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.0.0.1

# Minecraft / loader versions, locked for the 1.20.1 MVP slice.
minecraft_version=1.20.1
enabled_platforms=fabric,forge

archives_base_name=mc-sgs
mod_version=0.1.0-mvp
maven_group=dev.sgs

# https://maven.architectury.dev/dev/architectury/ (1.20.1 support line is 9.2.x)
architectury_version=9.2.14
# Versions contemporary with Architectury Loom 1.3.x (newer fabric-api triggers
# an unsupported mixin remap type in that Loom line; runtime accepts newer FAPI).
# https://maven.fabricmc.net/net/fabricmc/fabric-loader
fabric_loader_version=0.14.24
# https://maven.fabricmc.net/net/fabricmc/fabric-api
fabric_api_version=0.83.0+1.20.1
# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
forge_version=1.20.1-47.4.23
